schema: ./src/graphql/schema.graphql
documents:
  - ./src/graphql/queries/**/*.graphql
  - ./src/graphql/mutations/**/*.graphql
generates:
  ./src/graphql/index.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
  ./src/graphql/fragmentTypes.json:
    plugins:
      - fragment-matcher
config:
  skipTypename: true
